<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大厂 AI 面试训练</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <h1>大厂 AI 面试训练</h1>
        <p>移动端练习更方便，按步骤开始你的面试训练。</p>
      </header>

      <section id="loginSection" class="card">
        <h2>访问码登录</h2>
        <p class="muted">访问码在小红书订单发货信息中查看。</p>
        <form id="loginForm">
          <label for="accessCode">输入访问码</label>
          <div class="row">
            <input id="accessCode" name="accessCode" type="text" placeholder="例如：BASIC-2026" required />
            <button type="submit">进入训练</button>
          </div>
        </form>
        <p id="loginMsg" class="msg" aria-live="polite"></p>
      </section>

      <main id="dashboard" class="hidden">
        <section class="card">
          <h2>开通信息</h2>
          <div class="meta-list">
            <p><strong>当前开通版本：</strong><span id="versionText"></span></p>
            <p><strong>有效期：</strong><span id="expiryText"></span></p>
          </div>
          <h3>使用步骤</h3>
          <ol class="steps">
            <li>先做题库训练，熟悉高频问题。</li>
            <li>再看标准答案思路，整理自己的经历版本。</li>
            <li>打开 AI 面试官开始模拟，结束后做复盘。</li>
          </ol>
        </section>

        <section class="card">
          <h2>题库中心</h2>
          <div class="row wrap">
            <label for="roleFilter">岗位筛选</label>
            <select id="roleFilter"></select>
          </div>
          <ul id="questionList" class="question-list"></ul>
        </section>

        <section class="card">
          <h2>标准答案</h2>
          <p class="muted">点开看参考思路，再改成你的真实经历表达。</p>
          <div id="answerList"></div>
        </section>

        <section class="card">
          <h2>摄像头检测</h2>
          <p class="muted">面试前先检查画面和权限。</p>
          <button id="cameraBtn" type="button">开始检测</button>
          <p id="cameraMsg" class="msg"></p>
          <video id="cameraPreview" autoplay playsinline muted class="hidden"></video>
        </section>

        <section class="card">
          <h2>AI 面试官入口</h2>
          <div id="aiLinks" class="link-grid"></div>
        </section>
      </main>

      <footer>
        <p>本产品为 AI 模拟训练工具，不承诺实际面试结果，请结合个人真实经历使用。</p>
      </footer>
    </div>

    <script src="./questions.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
